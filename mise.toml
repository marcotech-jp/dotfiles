min_version = "2026.9.14"

[bootstrap.repos]
"~/.zsh/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }
# "~/.zsh/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git" }
"~/.zsh/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
"apt:htop" = "latest"
"apt:zsh" = "latest"

[dotfiles]
# Home directory
"~/.bashrc" = ".bashrc"
"~/.npmrc" = ".npmrc"
"~/.p10k.zsh" = ".p10k.zsh"
"~/.vimrc" = ".vimrc"
"~/.zshrc" = ".zshrc"

# XDG config files. Keep Git's writable copies out of the symlink tree.
"~/.config" = { source = ".config", mode = "symlink-each", exclude = ["git/config", "git/ignore"] }

# Keep Git config writable on each machine.
"~/.config/git/config" = { source = ".config/git/config", mode = "copy" }
"~/.config/git/ignore" = { source = ".config/git/ignore", mode = "copy" }

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 2
InitialKeyRepeat = 15
"com.apple.keyboard.fnState" = true

[bootstrap.macos.defaults."com.apple.dock"]
orientation = "left"
tilesize = 19.0
largesize = 71.0
magnification = true
"show-recents" = false
"show-process-indicators" = true
"wvous-bl-corner" = 13
"wvous-bl-modifier" = 0
"wvous-br-corner" = 1
"wvous-br-modifier" = 0

[bootstrap.macos.defaults."com.apple.controlcenter"]
AutoHideMenuBarOption = 2
"NSStatusItem VisibleCC Battery" = true
"NSStatusItem VisibleCC Clock" = true

[bootstrap.macos.defaults."com.apple.menuextra.battery"]
ShowPercent = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
FlashDateSeparators = true
Show24Hour = true
ShowAMPM = true
ShowDate = 1
ShowDayOfWeek = true
ShowSeconds = false
