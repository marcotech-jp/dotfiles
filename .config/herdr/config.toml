onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
surface_dim = "#444477"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

[ui.toast]
delivery = "off"

[keys]
prefix = "ctrl+a"

# Prefixを介さずに直接ペインを切り替える
focus_pane_left  = "ctrl+shift+h"
focus_pane_down  = "ctrl+shift+j"
focus_pane_up    = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

# タブ管理やペイン分割を直接行う
previous_tab = "ctrl+shift+left"
next_tab = "ctrl+shift+right"
new_tab = "prefix+t"
close_tab = "prefix+w"
split_vertical = "ctrl+shift+¥"
split_horizontal = "ctrl+shift+-"

previous_workspace = "ctrl+shift+up"
next_workspace     = "ctrl+shift+down"

[[keys.command]]
key = "ctrl+shift+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
