"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch$git_status\
$fill\
$python\
$aws\
$container\
$hostname\
${env_var.WSL_DISTRO_NAME}\
$cmd_duration\
$time\
$line_break\
$character"""

[os]
format = '[$symbol ]($style)'
disabled = false

[os.symbols]
Debian = "🌀 "
Macos = ' '
Ubuntu = ' '
Windows = ' '

[username]
show_always = true
format = '[$user]($style) '

[hostname]
format = '[$ssh_symbol$hostname]($style) '

[directory]
truncate_to_repo = false
truncation_symbol = '.../'

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
always_show_remote = true

[git_status]
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = '─'
style = 'fg:muted'

[python]
format = '[$symbol($version)(\(#$virtualenv\)) ]($style)'

[aws]
symbol = '🅰 '

[cmd_duration]
min_time = 3000
format = '[$duration ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:foreground"
format = '[  $time ]($style)'

[env_var.WSL_DISTRO_NAME]
format = '[WSL: $env_value]($style) '
style = 'cyan'
