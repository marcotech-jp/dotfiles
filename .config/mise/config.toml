[settings]
idiomatic_version_file_enable_tools = []
python.uv_venv_auto = true
experimental = true
minimum_release_age = "7d"
lockfile = true

[tools]
#----Core tools----
usage = "latest"
node = "lts"
bun = "latest"

#----Python----
python = ["3.13", "3.11"]
uv = "latest"
ruff = "latest"

#----AI Agent----
# claude = "latest"
# codex = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

#----command line tools----
starship = "latest"
aws-cli = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
herdr = "latest"

#----git----
gh = "latest"
ghq = "latest"
pre-commit = "latest"
lazygit = "latest"
gitleaks = "latest"

#----nvim----
neovim = "latest"
rg = "latest"
fd = "latest"
imagemagick = "latest"
