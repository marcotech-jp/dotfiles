name: setup-smoke

on:
  push:
    paths:
      - "setup.sh"
      - ".config/mise/config.toml"
      - ".github/workflows/setup-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate script syntax
        run: bash -n ./setup.sh

      - name: Run setup smoke test
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # GitHub-hosted Ubuntu runners cannot authenticate chsh through PAM.
            bash ./setup.sh --skip user
          else
            bash ./setup.sh
          fi

permissions:
  contents: read
